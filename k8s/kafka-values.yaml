image:
  registry: docker.io
  repository: bitnamilegacy/kafka
  tag: 4.0.0-debian-12-r10

replicaCount: 1

kraft:
  enabled: true
  processRoles: "broker,controller"
  controllerListenerNames: "CONTROLLER"

listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT

heapOpts: "-Xmx512m -Xms512m"

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "1"

persistence:
  enabled: true
  size: 8Gi